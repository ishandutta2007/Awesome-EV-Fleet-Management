<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.02); }
      }
      @keyframes flowDash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes energyPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.9; }
        50% { transform: translateY(-4px) scale(1.06); opacity: 1; filter: drop-shadow(0 0 12px #00E599); }
        100% { transform: translateY(0px) scale(1); opacity: 0.9; }
      }
      @keyframes floatVehicle {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(12px); }
      }
      @keyframes beamMove {
        0% { x: -300; }
        100% { x: 1300; }
      }

      .pulse-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .flow-circuit { stroke-dasharray: 12, 8; animation: flowDash 15s linear infinite; }
      .flow-circuit-fast { stroke-dasharray: 8, 6; animation: flowDash 8s linear infinite; }
      .energy-bolt { animation: energyPulse 2.5s ease-in-out infinite; transform-origin: center; }
      .vehicle-group { animation: floatVehicle 5s ease-in-out infinite; }
      .animated-beam { animation: beamMove 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="360" y1="0" x2="360" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
    <line x1="960" y1="0" x2="960" y2="420" />
    <line x1="1080" y1="0" x2="1080" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="100" r="180" fill="#00f2fe" opacity="0.12" filter="url(#glow-cyan)" class="pulse-glow" />
  <circle cx="1050" cy="300" r="220" fill="#00E599" opacity="0.1" filter="url(#glow-green)" class="pulse-glow" />
  <circle cx="600" cy="210" r="250" fill="#8A2BE2" opacity="0.07" filter="url(#glow-cyan)" />

  <!-- Animated Circuit Energy Lines -->
  <path d="M-50,340 L250,340 L340,390 L850,390 L950,320 L1250,320" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.5" class="flow-circuit" />
  <path d="M-50,80 L200,80 L280,30 L750,30 L820,90 L1250,90" fill="none" stroke="#00E599" stroke-width="2" opacity="0.45" class="flow-circuit-fast" />
  <path d="M150,420 L220,310 L220,150 L300,90" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3" class="flow-circuit" />
  <path d="M980,0 L980,140 L1060,220 L1150,220" fill="none" stroke="#00E599" stroke-width="1.5" opacity="0.3" class="flow-circuit-fast" />

  <!-- Animated Light Sweep Beam -->
  <rect class="animated-beam" y="0" width="160" height="420" fill="url(#neon-cyan)" opacity="0.04" transform="skewX(-25)" />

  <!-- Outer Card Frame with Glassmorphism Border -->
  <rect x="25" y="20" width="1150" height="380" rx="20" fill="url(#card-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Left Side: EV Fleet Telematics &amp; Charging Graphic Motif -->
  <g class="vehicle-group" transform="translate(65, 85)">
    <!-- Depot Charging Base Station Hexagon -->
    <polygon points="70,10 130,10 160,60 130,110 70,110 40,60" fill="#0f2038" stroke="#00f2fe" stroke-width="2" opacity="0.8" filter="url(#glow-cyan)" />
    
    <!-- Pulse Lightning Bolt inside Station -->
    <path class="energy-bolt" d="M103,30 L88,60 L102,60 L97,90 L115,55 L101,55 Z" fill="url(#neon-green)" filter="url(#glow-green)" />
    
    <!-- Vehicle Outline Silhouette -->
    <g transform="translate(18, 125)">
      <!-- Car Body -->
      <path d="M15,50 Q30,22 65,18 L110,18 Q140,20 165,45 L185,50 Q195,52 195,65 L195,78 Q195,85 185,85 L15,85 Q5,85 5,75 L5,60 Q5,50 15,50 Z" fill="#13233f" stroke="#00E599" stroke-width="2" />
      <!-- Windows -->
      <path d="M45,45 L70,25 L105,25 L105,45 Z" fill="#00f2fe" opacity="0.6" />
      <path d="M112,45 L112,25 L135,25 L155,45 Z" fill="#00f2fe" opacity="0.6" />
      <!-- Wheels with glow -->
      <circle cx="45" cy="85" r="16" fill="#0b1322" stroke="#00f2fe" stroke-width="3" />
      <circle cx="45" cy="85" r="6" fill="#00E599" />
      <circle cx="155" cy="85" r="16" fill="#0b1322" stroke="#00f2fe" stroke-width="3" />
      <circle cx="155" cy="85" r="6" fill="#00E599" />
      <!-- Battery Meter on vehicle -->
      <rect x="68" y="60" width="60" height="14" rx="4" fill="#080e18" stroke="#00E599" stroke-width="1.5" />
      <rect x="71" y="63" width="44" height="8" rx="2" fill="url(#neon-green)" />
      <rect x="129" y="64" width="2" height="6" rx="1" fill="#00E599" />
    </g>

    <!-- Radar / Telematics Signal Waves -->
    <path d="M120,120 A40,40 0 0,1 160,160" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <path d="M115,105 A60,60 0 0,1 175,165" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <path d="M110,90 A80,80 0 0,1 190,170" fill="none" stroke="#00f2fe" stroke-width="1" stroke-linecap="round" opacity="0.25" />
  </g>

  <!-- Central &amp; Right Content -->
  <g transform="translate(320, 75)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 5)">
      <rect width="250" height="28" rx="14" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#00E599" filter="url(#glow-green)" />
      <text x="28" y="19" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="85" fill="url(#accent-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.6))">
      Awesome EV Fleet Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
      Enterprise SaaS Platforms • Open-Source CSMS • Battery Analytics • Depot V2G &amp; Telematics
    </text>

    <!-- Tech Badges / Highlights inside Banner -->
    <g transform="translate(0, 155)">
      <!-- Item 1: Depot Charging Optimization -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1" />
        <text x="14" y="26" fill="#38bdf8" font-size="16">⚡</text>
        <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Depot Smart Charging</text>
      </g>

      <!-- Item 2: Battery Health & Telematics -->
      <g transform="translate(255, 0)">
        <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" />
        <text x="14" y="26" fill="#10b981" font-size="16">🔋</text>
        <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Battery Health &amp; SoC</text>
      </g>

      <!-- Item 3: OCPP 1.6 / 2.0.1 Open Source -->
      <g transform="translate(510, 0)">
        <rect width="245" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
        <text x="14" y="26" fill="#c084fc" font-size="16">🔌</text>
        <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">OCPP 1.6 / 2.0.1 &amp; CSMS</text>
      </g>

      <!-- Second Row Highlights -->
      <g transform="translate(0, 52)">
        <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1" />
        <text x="14" y="26" fill="#f59e0b" font-size="16">📈</text>
        <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Fleet TCO &amp; Analytics</text>
      </g>

      <g transform="translate(255, 52)">
        <rect width="240" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1" />
        <text x="14" y="26" fill="#ec4899" font-size="16">🌐</text>
        <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">V2G &amp; Energy Arbitrage</text>
      </g>

      <g transform="translate(510, 52)">
        <rect width="245" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
        <text x="14" y="26" fill="#38bdf8" font-size="16">🛣️</text>
        <text x="38" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">EV Range Route Planners</text>
      </g>
    </g>
  </g>
</svg>
